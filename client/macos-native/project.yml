name: VibeCodingPlusNative
options:
  bundleIdPrefix: com.mac20777
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
targets:
  VibeCodingPlusNative:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mac20777.vibecodingplus
        PRODUCT_NAME: VibeCoding Plus
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  VibeCodingPlusNative:
    build:
      targets:
        VibeCodingPlusNative: all
    run:
      config: Debug
      environmentVariables:
        VIBE_REPO_ROOT: ${PROJECT_DIR}/../..
