<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    macOS app icon master (1024×1024).
    - Square opaque canvas; system applies the squircle mask.
    - Keep primary artwork inside the 512 px diameter safe circle (~256 px radius).
    - Do not bake corner radius or transparency into the asset.
  -->
  <defs>
    <linearGradient id="bg" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCFAF3"/>
      <stop offset="0.45" stop-color="#F1EEE4"/>
      <stop offset="1" stop-color="#D9D4C8"/>
    </linearGradient>
    <radialGradient id="glow" cx="420" cy="300" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="312" y1="260" x2="712" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFEF9"/>
      <stop offset="1" stop-color="#ECE7DB"/>
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-16%" width="140%" height="148%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#151413" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(512 512) scale(0.82) translate(-512 -512)">
    <g filter="url(#markShadow)">
      <circle cx="512" cy="500" r="318" fill="url(#mark)"/>
    </g>

    <g fill="none" stroke="#171614" stroke-linecap="round" stroke-linejoin="round">
      <rect x="468" y="286" width="76" height="118" rx="38" stroke-width="20" fill="#F7F4EC"/>
      <path d="M494 324h24M494 346h24M494 368h24" stroke-width="10"/>
      <path d="M448 404c0 35 28 63 64 63s64-28 64-63" stroke-width="18"/>
      <path d="M512 467v44" stroke-width="18"/>
      <path d="M472 511h80" stroke-width="18"/>

      <path d="M356 548 286 628l70 80" stroke-width="52"/>
      <path d="M668 548 738 628l-70 80" stroke-width="52"/>
      <path d="M448 700 512 520 576 700" stroke-width="42"/>

      <path d="M318 742c48-42 78 34 126-8s78 34 126-8 78 34 126-8 78 34 126-8" stroke-width="34"/>
    </g>

    <circle cx="548" cy="312" r="17" fill="#D93025"/>

    <g>
      <circle cx="704" cy="704" r="62" fill="#171614"/>
      <path d="M704 668v72M668 704h72" fill="none" stroke="#FCFAF3" stroke-width="24" stroke-linecap="round"/>
    </g>
  </g>
</svg>
